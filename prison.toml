[box]
sudo = true
shadow = [
    ".venv",
    "target",
    "__pycache__",
]

[prison]
inmates = [
    "claude",
]

[setup]
commands = [
    "sudo apt-get update",
    "sudo apt-get -y install python3.11",
    "sudo apt-get -y install python3-pip",
    "sudo apt-get -y install python3.11-venv",
    "python3.11 -m venv .venv",
]

[egress]
hosts = [
    "*.aml1.id.iosda.org:8888",
]
